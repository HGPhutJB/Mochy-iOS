name: Deploy Mochy Cloud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-server.yml']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kiểm tra khoá Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Chưa có secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — bỏ qua triển khai."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Tạo (hoặc lấy) KV namespace
        if: env.SKIP != '1'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 kv:namespace list > ns.json
          ID=$(node -e 'const l=JSON.parse(require("fs").readFileSync("ns.json","utf8"));const x=l.find(n=>n.title==="mochy-cloud-MOCHY_KV"||n.title==="MOCHY_KV");console.log(x?x.id:"")')
          if [ -z "$ID" ]; then
            npx --yes wrangler@3 kv:namespace create MOCHY_KV
            npx --yes wrangler@3 kv:namespace list > ns.json
            ID=$(node -e 'const l=JSON.parse(require("fs").readFileSync("ns.json","utf8"));const x=l.find(n=>n.title.endsWith("MOCHY_KV"));console.log(x?x.id:"")')
          fi
          test -n "$ID"
          sed -i "s/REPLACE_WITH_KV_ID/$ID/" wrangler.toml
      - name: Triển khai Worker
        if: env.SKIP != '1'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 deploy | tee deploy.log
      - name: Địa chỉ máy chủ
        if: env.SKIP != '1'
        working-directory: server
        run: grep -o 'https://[^ ]*workers.dev' deploy.log | head -1 | tee -a "$GITHUB_STEP_SUMMARY"
